name: ci

on:
  push:
  pull_request:

jobs:
  app-core-linux:
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: swift format lint --strict --configuration .swift-format -r Packages HelloApp
      - name: Test
        working-directory: Packages/AppCore
        run: swift test

  helloapp-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build HelloApp (SwiftPM targeting iOS)
        run: |
          cd HelloApp
          # Build with SwiftPM targeting iOS SDK
          swift build -c release --sdk $(xcrun --sdk iphonesimulator --show-sdk-path)
          echo "SwiftPM build for iOS succeeded"
